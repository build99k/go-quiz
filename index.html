<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>워크샵 퀴즈</title>

<!-- =====================================================================
     문제 데이터 — 문제 추가/수정은 여기만 고치면 됩니다.
     - 카테고리(영화 OST, K-POP …)를 categories 에 추가하면 상단 탭이 자동 생성됩니다.
     - 퀴즈 id(예: movie-01)는 점수 합산 페이지에서 참조할 수 있도록 바꾸지 않는 것을 권장합니다.
     - points 를 생략하면 난이도별 기본 점수(defaultPoints)가 적용됩니다.
     - start 는 재생 시작 위치(초)입니다. 유튜브 링크의 t=200s → start: 200
     ===================================================================== -->
<script>
window.QUIZ_DATA = {
  title: '워크샵 퀴즈',

  levels: {
    easy:   { label: '쉬움',   defaultPoints: 10 },
    normal: { label: '보통',   defaultPoints: 20 },
    hard:   { label: '어려움', defaultPoints: 30 },
  },

  categories: [
    {
      id: 'movie',
      name: '영화 OST',
      question: '이 음악이 나온 영화의 제목은?',
      quizzes: [
        { id: 'movie-01', videoId: 'qHtcHxx6UfQ', start: 200, level: 'easy',
          answer: '타이타닉', detail: 'Titanic (1997) · My Heart Will Go On – Céline Dion' },
        { id: 'movie-02', videoId: '37SVhKjUrEQ', start: 0, level: 'easy',
          answer: '라라랜드', detail: 'La La Land (2016) · City of Stars' },
        { id: 'movie-03', videoId: 'jZIVYXicHHI', start: 0, level: 'normal',
          answer: '기생충', detail: 'Parasite (2019) · 믿음의 벨트 – 정재일' },
        { id: 'movie-04', videoId: 'oeLHy3dIiXs', start: 16, level: 'hard',
          answer: '장화, 홍련', detail: 'A Tale of Two Sisters (2003) · 돌이킬 수 없는 걸음 – 이병우' },
        { id: 'movie-05', videoId: 'hvQCCGaLRV4', start: 47, level: 'normal',
          answer: '태극기 휘날리며', detail: 'Taegukgi (2004) · 메인 테마' },
        { id: 'movie-06', videoId: '5ysdHjaeGGU', start: 160, level: 'normal',
          answer: '클래식', detail: 'The Classic (2003) · 너에게 난, 나에게 넌 – 자전거 탄 풍경' },
        { id: 'movie-07', videoId: '1vU4qYnyOlY', start: 101, level: 'normal',
          answer: '알라딘', detail: 'Aladdin (2019) · Speechless – Naomi Scott' },
        { id: 'movie-08', videoId: '6GYK1pDz4Xc', start: 142, level: 'normal',
          answer: '위대한 쇼맨', detail: 'The Greatest Showman (2017) · Rewrite the Stars' },
        { id: 'movie-09', videoId: '_DxjFs_dsR8', start: 10, level: 'normal',
          answer: '올드보이', detail: 'Oldboy (2003) · The Last Waltz' },
        { id: 'movie-10', videoId: 'zu8THoRRZW0', start: 2, level: 'normal',
          answer: '토르: 라그나로크', detail: 'Thor: Ragnarok (2017) · Immigrant Song – Led Zeppelin' },
      ],
    },

    // 예시) K-POP 카테고리는 아래 형식으로 추가하면 됩니다.
    // {
    //   id: 'kpop',
    //   name: 'K-POP',
    //   question: '이 노래의 가수는?',
    //   quizzes: [
    //     { id: 'kpop-01', videoId: 'XXXXXXXXXXX', start: 30, level: 'easy', answer: '가수명', detail: '곡명 (연도)' },
    //   ],
    // },
  ],
};
</script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --base: #000;
    --bg: #121212;
    --surface: #181818;
    --surface-2: #1f1f1f;
    --surface-hover: #282828;
    --chip: #2a2a2a;
    --text: #fff;
    --sub: #b3b3b3;
    --dim: #727272;
    --track: #4d4d4d;
    --green: #1ed760;
    --green-hover: #3be477;
    --lv: 30 215 96;
  }
  [data-level="easy"]   { --lv: 30 215 96; }
  [data-level="normal"] { --lv: 255 164 43; }
  [data-level="hard"]   { --lv: 243 114 127; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--base); color: var(--text);
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { display: block; }
  [hidden] { display: none !important; }

  .app { height: 100vh; display: flex; flex-direction: column; }

  /* ---------- 상단 바 ---------- */
  .banner { background: #e91429; color: #fff; padding: 10px 20px; font-size: 14px; font-weight: 600; text-align: center; line-height: 1.6; }
  .appbar { display: flex; align-items: center; gap: 16px; padding: 12px 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; white-space: nowrap; }
  .brand-mark { width: 32px; height: 32px; border-radius: 50%; background: var(--green); color: #000; display: grid; place-items: center; font-weight: 900; }
  .chips { display: flex; gap: 8px; flex: 1; overflow-x: auto; }
  .chip { padding: 7px 14px; border-radius: 999px; background: var(--chip); font-size: 14px; font-weight: 600; white-space: nowrap; transition: background .15s; }
  .chip:hover { background: #333; }
  .chip.active { background: var(--text); color: #000; }

  .panel { flex: 1; min-height: 0; margin: 0 8px 8px; border-radius: 8px; background: var(--bg); overflow: auto; }

  /* ---------- 버튼 ---------- */
  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 18px; border-radius: 999px;
    border: 1px solid var(--dim); background: transparent;
    font-size: 14px; font-weight: 700; white-space: nowrap;
    transition: transform .1s, border-color .15s, background .15s;
  }
  .pill:hover { border-color: var(--text); transform: scale(1.04); }
  .pill.primary { background: var(--green); border-color: var(--green); color: #000; }
  .pill.primary:hover { background: var(--green-hover); border-color: var(--green-hover); }
  .pill.solid { background: var(--text); border-color: var(--text); color: #000; }
  .pill.small { padding: 6px 14px; font-size: 13px; }
  .pill kbd { font: inherit; font-size: 11px; opacity: .6; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
  .round {
    width: 34px; height: 34px; border-radius: 50%; background: rgba(0, 0, 0, .55);
    display: grid; place-items: center; transition: background .15s;
  }
  .round:hover { background: #000; }
  .round svg { width: 18px; height: 18px; }
  .round[aria-disabled="true"] { opacity: .3; pointer-events: none; }

  /* ---------- 문제 목록 ---------- */
  .hero { padding: 48px 32px 28px; background: linear-gradient(180deg, rgb(30 215 96 / .35), rgb(30 215 96 / 0)); }
  .kicker { font-size: 14px; font-weight: 700; }
  .hero h1 { margin: 6px 0 14px; font-size: clamp(44px, 7vw, 92px); font-weight: 900; letter-spacing: -.045em; line-height: 1; }
  .meta { color: var(--sub); font-size: 15px; font-weight: 600; line-height: 1.6; }
  .meta b { color: var(--text); }
  .meta .sep { margin: 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 12px 32px 48px; }
  .tile {
    position: relative; display: flex; flex-direction: column; gap: 8px;
    min-height: 200px; padding: 16px 16px 18px; border-radius: 8px;
    background-color: var(--surface);
    background-image: linear-gradient(155deg, rgb(var(--lv) / .42) 0%, rgb(var(--lv) / .08) 55%, rgb(var(--lv) / 0) 80%);
    transition: background-color .2s, opacity .2s;
  }
  .tile:hover { background-color: var(--surface-hover); }
  .tile-top { display: flex; justify-content: space-between; align-items: center; min-height: 24px; }
  .tile-no { font-size: 14px; font-weight: 700; color: var(--sub); }
  .tile-badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(255, 255, 255, .14); }
  .tile-badge.done { background: var(--green); color: #000; }
  .tile-points { margin-top: auto; font-size: 64px; font-weight: 900; letter-spacing: -.05em; line-height: .95; }
  .tile-points small, .q-points small { font-size: .38em; font-weight: 700; letter-spacing: 0; margin-left: 3px; }
  .level {
    align-self: flex-start; display: inline-flex; align-items: center;
    padding: 4px 12px; border-radius: 999px;
    background: rgb(var(--lv)); color: #000; font-size: 15px; font-weight: 800;
  }
  .tile-answer { min-height: 20px; padding-right: 60px; font-size: 14px; font-weight: 600; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-play {
    position: absolute; right: 16px; bottom: 16px;
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--green); color: #000; display: grid; place-items: center;
    box-shadow: 0 8px 16px rgba(0, 0, 0, .35);
    opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s;
  }
  .tile-play svg { width: 22px; height: 22px; }
  .tile:hover .tile-play { opacity: 1; transform: none; }
  .tile.is-done { opacity: .45; }
  .tile.is-done:hover { opacity: .8; }
  .empty { grid-column: 1 / -1; padding: 60px 20px; text-align: center; color: var(--sub); border-radius: 8px; background: var(--surface); }

  /* ---------- 문제 화면 ---------- */
  .stage {
    min-height: 100%; display: flex; flex-direction: column; gap: 14px;
    padding: 16px 24px 12px;
    background: linear-gradient(180deg, rgb(var(--lv) / .26), rgb(var(--lv) / 0) 280px);
  }
  .stage-head { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
  .stage-id { display: flex; align-items: center; gap: 8px; }
  .stage-id .info { display: flex; align-items: center; gap: 12px; margin: 0 8px; }
  .q-no { font-size: 15px; font-weight: 700; color: var(--sub); }
  .q-points { font-size: 40px; font-weight: 900; letter-spacing: -.04em; line-height: 1; }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .state-badge { font-size: 13px; font-weight: 700; color: var(--sub); margin-right: 4px; }
  .state-badge.done { color: var(--green); }

  .screen { position: relative; flex: 1; min-height: 260px; border-radius: 8px; overflow: hidden; background: #000; }
  .screen iframe, #playerHost { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .cover {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    background:
      radial-gradient(80% 60% at 50% 115%, rgb(30 215 96 / .16), transparent 70%),
      linear-gradient(180deg, #1c1c1c, #101010);
    transition: opacity .35s;
  }
  .screen.show-video .cover { opacity: 0; pointer-events: none; }
  .cover-main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
  .question { font-size: clamp(24px, 2.8vw, 38px); font-weight: 800; letter-spacing: -.03em; }
  .status { color: var(--sub); font-size: 16px; font-weight: 600; }
  .eq { height: 36%; display: flex; align-items: flex-end; justify-content: center; gap: 5px; padding: 0 32px; transition: opacity .4s; }
  .eq span {
    flex: 1; max-width: 10px; height: 100%; border-radius: 3px 3px 0 0;
    background: linear-gradient(180deg, var(--green), #128a3e);
    transform-origin: bottom; transform: scaleY(var(--h));
  }
  .cover.playing .eq span { animation: eq var(--d) ease-in-out var(--delay) infinite alternate; }
  @keyframes eq { from { transform: scaleY(.08); } to { transform: scaleY(1); } }
  .cover.revealed .eq { opacity: .22; }
  .cover.revealed .question, .cover.revealed .status { display: none; }
  .cover.has-error .eq { display: none; }

  .answer { animation: pop .45s cubic-bezier(.2, 1.5, .4, 1); }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  .answer-label { font-size: 14px; font-weight: 800; letter-spacing: .14em; color: var(--green); }
  .answer-title { margin-top: 6px; font-size: clamp(44px, 6.5vw, 96px); font-weight: 900; letter-spacing: -.045em; line-height: 1.05; }
  .answer-detail { margin-top: 12px; font-size: clamp(15px, 1.4vw, 19px); font-weight: 600; color: var(--sub); }

  .error { max-width: 560px; color: var(--sub); line-height: 1.6; }
  .error strong { display: block; margin-bottom: 4px; font-size: 18px; color: #f3727f; }
  .error a { color: var(--green); text-decoration: underline; }
  .video-toggle { position: absolute; top: 14px; right: 14px; z-index: 2; background: rgba(0, 0, 0, .6); }

  /* 플레이어 바 */
  .player-bar { display: grid; grid-template-columns: 1fr minmax(320px, 1.6fr) 1fr; align-items: center; gap: 12px 24px; }
  .jump { justify-self: start; display: flex; align-items: center; gap: 8px; }
  .jump input {
    width: 108px; padding: 8px 14px; border-radius: 999px; border: 1px solid transparent;
    background: var(--chip); color: var(--text); font: inherit; font-size: 14px; font-variant-numeric: tabular-nums;
  }
  .jump input::placeholder { color: var(--dim); }
  .jump input:focus { outline: none; border-color: var(--text); }
  .jump input.invalid { border-color: #f3727f; }
  .jump .hint { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .center { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .transport { display: flex; align-items: center; gap: 14px; }
  .ctl {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px;
    border: none; background: none; color: var(--sub); font-size: 13px; font-weight: 700;
    transition: color .15s, transform .1s;
  }
  .ctl:hover { color: var(--text); transform: scale(1.06); }
  .ctl svg { width: 18px; height: 18px; }
  .play {
    width: 60px; height: 60px; margin: 0 8px; border-radius: 50%; border: none;
    background: var(--green); color: #000; display: grid; place-items: center;
    transition: transform .1s, background .15s;
  }
  .play:hover { transform: scale(1.06); background: var(--green-hover); }
  .play:active { transform: scale(.96); }
  .play svg { width: 26px; height: 26px; }
  .play .i-pause, .play.is-playing .i-play { display: none; }
  .play.is-playing .i-pause { display: block; }
  .timeline { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .timeline span { min-width: 38px; }
  .timeline span:first-child { text-align: right; }
  .volume { justify-self: end; display: flex; align-items: center; gap: 8px; width: 170px; color: var(--sub); }
  .volume svg { width: 18px; height: 18px; flex: none; }

  .bar {
    --fill: var(--text);
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 16px; margin: 0; background: transparent; cursor: pointer;
    background: linear-gradient(to right, var(--fill) var(--pct, 0%), var(--track) var(--pct, 0%)) center / 100% 4px no-repeat;
  }
  .bar:hover, .bar:active { --fill: var(--green); }
  .bar::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; border: none;
    background: var(--text); box-shadow: 0 2px 4px rgba(0, 0, 0, .5); opacity: 0;
  }
  .bar:hover::-webkit-slider-thumb, .bar:active::-webkit-slider-thumb { opacity: 1; }
  .bar::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; border: none; background: var(--text); opacity: 0; }
  .bar:hover::-moz-range-thumb { opacity: 1; }
  .bar::-moz-range-track { background: transparent; }

  .keys { margin: 0; text-align: center; font-size: 12px; color: var(--dim); }
  .keys kbd { font: inherit; padding: 0 5px; border: 1px solid #3e3e3e; border-radius: 4px; color: var(--sub); }

  @media (max-width: 900px) {
    .player-bar { grid-template-columns: 1fr; }
    .jump, .volume { justify-self: center; }
  }
  @media (max-width: 640px) {
    .appbar { flex-wrap: wrap; }
    .chips { order: 3; flex-basis: 100%; }
    .hero { padding: 32px 16px 20px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 8px 16px 32px; }
    .tile { min-height: 170px; }
    .tile-points { font-size: 48px; }
    .stage { padding: 12px 16px; }
    .q-points { font-size: 30px; }
    .keys { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="banner" id="fileBanner" hidden>
    파일을 더블클릭해서 열면(file://) 유튜브 정책상 음원이 재생되지 않습니다 (오류 153). http:// 또는 https:// 주소로 열어주세요.
  </div>

  <header class="appbar">
    <div class="brand"><span class="brand-mark">Q</span><span id="appTitle">워크샵 퀴즈</span></div>
    <nav class="chips" id="tabs" aria-label="퀴즈 카테고리"></nav>
    <button class="pill small" id="resetAllBtn" type="button">전체 초기화</button>
  </header>

  <main class="panel" id="panel">
    <!-- 문제 목록 -->
    <section id="board">
      <div class="hero">
        <div class="kicker">퀴즈</div>
        <h1 id="boardTitle"></h1>
        <div class="meta" id="boardMeta"></div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- 문제 화면 -->
    <section class="stage" id="stage" hidden>
      <div class="stage-head">
        <div class="stage-id">
          <a class="round" id="backBtn" href="#" title="목록 (Esc)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </a>
          <a class="round" id="prevBtn" href="#" title="이전 문제">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </a>
          <a class="round" id="nextBtn" href="#" title="다음 문제">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </a>
          <div class="info">
            <span class="q-no" id="stageNo"></span>
            <span class="level" id="stageLevel"></span>
            <span class="q-points"><span id="stagePoints"></span><small>점</small></span>
          </div>
        </div>
        <div class="actions">
          <span class="state-badge" id="stateBadge"></span>
          <button class="pill primary" id="revealBtn" type="button"></button>
          <button class="pill" id="doneBtn" type="button"></button>
          <button class="pill" id="resetQuizBtn" type="button">이 문제 리셋</button>
        </div>
      </div>

      <div class="screen" id="screen">
        <div id="playerHost"></div>
        <div class="cover" id="cover">
          <div class="cover-main">
            <div class="question" id="stageQuestion"></div>
            <div class="status" id="status"></div>
            <div class="error" id="error" hidden></div>
            <div class="answer" id="answerBox" hidden>
              <div class="answer-label">정답</div>
              <div class="answer-title" id="answerTitle"></div>
              <div class="answer-detail" id="answerDetail"></div>
            </div>
          </div>
          <div class="eq" id="eq"></div>
        </div>
        <button class="pill small video-toggle" id="videoBtn" type="button" hidden>영상 보기</button>
      </div>

      <div class="player-bar">
        <form class="jump" id="jumpForm" autocomplete="off">
          <input id="jumpInput" placeholder="위치 1:30" inputmode="numeric" aria-label="이동할 위치">
          <button class="pill small" type="submit">이동</button>
          <span class="hint" id="startHint"></span>
        </form>

        <div class="center">
          <div class="transport">
            <button class="ctl" id="stopBtn" type="button" title="정지 (시작 지점으로)">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>정지
            </button>
            <button class="ctl" id="back10Btn" type="button" title="10초 뒤로">−10초</button>
            <button class="play" id="playBtn" type="button" aria-label="재생">
              <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
            </button>
            <button class="ctl" id="fwd10Btn" type="button" title="10초 앞으로">+10초</button>
            <button class="ctl" id="restartBtn" type="button" title="시작 지점부터 다시 재생">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>처음부터
            </button>
          </div>
          <div class="timeline">
            <span id="curTime">0:00</span>
            <input class="bar" type="range" id="seek" min="0" max="0" step="1" value="0" aria-label="재생 위치">
            <span id="durTime">0:00</span>
          </div>
        </div>

        <label class="volume" title="볼륨">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input class="bar" type="range" id="volume" min="0" max="100" step="1" aria-label="볼륨">
        </label>
      </div>

      <p class="keys">
        <kbd>Space</kbd> 재생/일시정지 · <kbd>←</kbd><kbd>→</kbd> 5초 이동 · <kbd>R</kbd> 처음부터 ·
        <kbd>A</kbd> 정답 · <kbd>D</kbd> 완료 · <kbd>V</kbd> 영상 · <kbd>PgUp</kbd><kbd>PgDn</kbd> 이전/다음 · <kbd>Esc</kbd> 목록
      </p>
    </section>
  </main>
</div>

<script>
(() => {
  const DATA = window.QUIZ_DATA;
  const $ = (sel) => document.querySelector(sel);
  const el = {
    fileBanner: $('#fileBanner'), appTitle: $('#appTitle'), tabs: $('#tabs'), resetAllBtn: $('#resetAllBtn'), panel: $('#panel'),
    board: $('#board'), boardTitle: $('#boardTitle'), boardMeta: $('#boardMeta'), grid: $('#grid'),
    stage: $('#stage'), backBtn: $('#backBtn'), prevBtn: $('#prevBtn'), nextBtn: $('#nextBtn'),
    stageNo: $('#stageNo'), stageLevel: $('#stageLevel'), stagePoints: $('#stagePoints'),
    stateBadge: $('#stateBadge'), revealBtn: $('#revealBtn'), doneBtn: $('#doneBtn'), resetQuizBtn: $('#resetQuizBtn'),
    screen: $('#screen'), cover: $('#cover'), stageQuestion: $('#stageQuestion'), status: $('#status'), error: $('#error'),
    answerBox: $('#answerBox'), answerTitle: $('#answerTitle'), answerDetail: $('#answerDetail'), eq: $('#eq'), videoBtn: $('#videoBtn'),
    jumpForm: $('#jumpForm'), jumpInput: $('#jumpInput'), startHint: $('#startHint'),
    stopBtn: $('#stopBtn'), back10Btn: $('#back10Btn'), playBtn: $('#playBtn'), fwd10Btn: $('#fwd10Btn'), restartBtn: $('#restartBtn'),
    curTime: $('#curTime'), seek: $('#seek'), durTime: $('#durTime'), volume: $('#volume'),
  };

  // ---------- 저장소 (새로고침해도 진행 상태·볼륨 유지) ----------
  const KEY = { progress: 'workshop-quiz:progress', volume: 'workshop-quiz:volume' };
  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    remove(k) { try { localStorage.removeItem(k); } catch {} },
  };
  // { [퀴즈id]: 'revealed' | 'done' }
  let progress = store.get(KEY.progress, {}) || {};
  const saveProgress = () => store.set(KEY.progress, progress);

  // ---------- 유틸 ----------
  const pad2 = (n) => String(n).padStart(2, '0');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const levelLabel = (q) => DATA.levels[q.level]?.label ?? q.level;
  const pointsOf = (q) => q.points ?? DATA.levels[q.level]?.defaultPoints ?? 0;
  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return h ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`;
  }
  // "90", "1:30", "1:02:03" → 초
  function parseTime(str) {
    str = str.trim();
    if (!/^\d+(:\d{1,2}){0,2}$/.test(str)) return null;
    return str.split(':').reduce((acc, part) => acc * 60 + Number(part), 0);
  }
  function setBar(input, value, max) {
    input.style.setProperty('--pct', `${max > 0 ? Math.min(100, (value / max) * 100) : 0}%`);
  }
  const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';

  // ---------- 상태 ----------
  const state = { cat: null, quiz: null, seeking: false, answerShown: false };
  const yt = { apiReady: false, apiFailed: false, player: null, ready: false, playerState: -1 };

  // ---------- 라우팅 (#카테고리id 또는 #퀴즈id) ----------
  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    for (const cat of DATA.categories) {
      if (cat.id === id) return showBoard(cat);
      const quiz = cat.quizzes.find((q) => q.id === id);
      if (quiz) return showStage(cat, quiz);
    }
    showBoard(DATA.categories[0]);
  }

  function renderTabs() {
    el.tabs.innerHTML = DATA.categories.map((c) =>
      `<a class="chip ${c === state.cat ? 'active' : ''}" href="#${esc(c.id)}">${esc(c.name)}</a>`).join('');
  }

  // ---------- 문제 목록 ----------
  function showBoard(cat) {
    pauseIfPlaying();
    state.cat = cat;
    state.quiz = null;
    renderTabs();

    const total = cat.quizzes.length;
    const done = cat.quizzes.filter((q) => progress[q.id] === 'done').length;
    const totalPoints = cat.quizzes.reduce((sum, q) => sum + pointsOf(q), 0);
    el.boardTitle.textContent = cat.name;
    el.boardMeta.innerHTML = `${esc(cat.question)}<span class="sep">•</span><b>${total}문제</b><span class="sep">•</span>총 ${totalPoints}점<span class="sep">•</span>완료 ${done}/${total}`;

    el.grid.innerHTML = total ? cat.quizzes.map((q, i) => {
      const st = progress[q.id];
      const badge = st === 'done' ? '<span class="tile-badge done">✓ 완료</span>'
        : st === 'revealed' ? '<span class="tile-badge">정답 공개</span>' : '';
      return `
        <a class="tile ${st ? `is-${st}` : ''}" data-level="${esc(q.level)}" href="#${esc(q.id)}">
          <div class="tile-top"><span class="tile-no">Q${pad2(i + 1)}</span>${badge}</div>
          <div class="tile-points">${pointsOf(q)}<small>점</small></div>
          <span class="level">${esc(levelLabel(q))}</span>
          <div class="tile-answer">${st ? esc(q.answer) : ''}</div>
          <span class="tile-play" aria-hidden="true">${PLAY_ICON}</span>
        </a>`;
    }).join('') : '<div class="empty">아직 등록된 문제가 없습니다.</div>';
    el.stage.hidden = true;
    el.board.hidden = false;
  }

  // ---------- 문제 화면 ----------
  function showStage(cat, quiz) {
    const sameQuiz = state.quiz === quiz;
    state.cat = cat;
    state.quiz = quiz;
    renderTabs();

    const idx = cat.quizzes.indexOf(quiz);
    el.stage.dataset.level = quiz.level;
    el.stageNo.textContent = `Q${pad2(idx + 1)}`;
    el.stageLevel.textContent = levelLabel(quiz);
    el.stagePoints.textContent = pointsOf(quiz);
    el.stageQuestion.textContent = cat.question;
    el.startHint.textContent = `시작 ${fmt(quiz.start)}`;
    el.backBtn.href = `#${cat.id}`;
    setLink(el.prevBtn, cat.quizzes[idx - 1]);
    setLink(el.nextBtn, cat.quizzes[idx + 1]);

    el.board.hidden = true;
    el.stage.hidden = false;
    if (sameQuiz) return renderQuizState();

    el.panel.scrollTop = 0;
    setAnswerVisible(Boolean(progress[quiz.id]));
    showTime(quiz.start);
    el.seek.max = 0;
    setBar(el.seek, 0, 0);
    el.durTime.textContent = '0:00';
    loadIntoPlayer(quiz);
  }

  function setLink(a, quiz) {
    if (quiz) { a.href = `#${quiz.id}`; a.removeAttribute('aria-disabled'); }
    else { a.removeAttribute('href'); a.setAttribute('aria-disabled', 'true'); }
  }

  function renderQuizState() {
    const st = progress[state.quiz.id];
    el.stateBadge.textContent = st === 'done' ? '✓ 완료됨' : st === 'revealed' ? '정답 공개됨' : '';
    el.stateBadge.classList.toggle('done', st === 'done');
    el.revealBtn.innerHTML = `${state.answerShown ? '정답 숨기기' : '정답 공개'} <kbd>A</kbd>`;
    el.revealBtn.classList.toggle('primary', !state.answerShown);
    el.doneBtn.innerHTML = `${st === 'done' ? '완료 취소' : '완료 처리'} <kbd>D</kbd>`;
    el.doneBtn.classList.toggle('solid', st !== 'done' && state.answerShown);
  }

  function setAnswerVisible(show) {
    state.answerShown = show;
    el.cover.classList.toggle('revealed', show);
    el.answerBox.hidden = !show;
    el.videoBtn.hidden = !show;
    if (show) {
      el.answerTitle.textContent = state.quiz.answer;
      el.answerDetail.textContent = state.quiz.detail ?? '';
    } else {
      setVideo(false);
    }
    renderQuizState();
  }

  function setVideo(show) {
    el.screen.classList.toggle('show-video', show);
    el.videoBtn.textContent = show ? '영상 숨기기' : '영상 보기';
  }

  // 정답 공개 / 숨기기
  function toggleAnswer() {
    if (state.answerShown) return setAnswerVisible(false);
    if (!progress[state.quiz.id]) { progress[state.quiz.id] = 'revealed'; saveProgress(); }
    setAnswerVisible(true);
  }
  // 완료 처리 / 취소
  function toggleDone() {
    progress[state.quiz.id] = progress[state.quiz.id] === 'done' ? 'revealed' : 'done';
    saveProgress();
    setAnswerVisible(true);
  }
  // 이 문제만 처음 상태로
  function resetQuiz() {
    delete progress[state.quiz.id];
    saveProgress();
    setAnswerVisible(false);
    if (yt.ready) stop();
  }

  // ---------- 유튜브 플레이어 ----------
  const STATUS = { '-1': '재생 버튼을 누르세요', 0: '재생이 끝났습니다', 1: '재생 중', 2: '일시정지', 3: '불러오는 중…', 5: '재생 버튼을 누르세요' };
  const ERRORS = {
    api: 'YouTube 플레이어를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침 해주세요.',
    2: '영상 ID가 올바르지 않습니다. 파일 상단 데이터의 videoId를 확인해주세요.',
    5: '이 브라우저에서 재생할 수 없는 영상입니다.',
    100: '삭제되었거나 비공개로 바뀐 영상입니다.',
    101: '영상 소유자가 외부 사이트 재생을 막아두었습니다. 다른 영상으로 교체해주세요.',
    150: '영상 소유자가 외부 사이트 재생을 막아두었습니다. 다른 영상으로 교체해주세요.',
    153: '파일을 직접 열면(file://) 유튜브가 재생을 막습니다. http:// 또는 https:// 주소로 열어주세요.',
  };

  function loadIntoPlayer(quiz) {
    setError(null);
    if (yt.apiFailed) return setError('api');
    if (!yt.apiReady) return setStatus('플레이어 준비 중…');   // API 로드 후 onYouTubeIframeAPIReady 에서 다시 호출
    if (!yt.player) return createPlayer(quiz);
    if (!yt.ready) return;                                     // onReady 에서 현재 문제를 불러옴
    yt.player.cueVideoById({ videoId: quiz.videoId, startSeconds: quiz.start });
  }

  function createPlayer(quiz) {
    setStatus('플레이어 준비 중…');
    yt.player = new YT.Player('playerHost', {
      width: '100%',
      height: '100%',
      videoId: quiz.videoId,
      playerVars: {
        start: quiz.start, controls: 0, disablekb: 1, fs: 0, rel: 0,
        iv_load_policy: 3, playsinline: 1, modestbranding: 1,
        ...(location.protocol.startsWith('http') ? { origin: location.origin } : {}),
      },
      events: {
        onReady() {
          yt.ready = true;
          yt.player.setVolume(Number(el.volume.value));
          if (state.quiz) yt.player.cueVideoById({ videoId: state.quiz.videoId, startSeconds: state.quiz.start });
        },
        onStateChange(e) {
          yt.playerState = e.data;
          const playing = e.data === YT.PlayerState.PLAYING;
          el.cover.classList.toggle('playing', playing);
          el.playBtn.classList.toggle('is-playing', playing || e.data === YT.PlayerState.BUFFERING);
          el.playBtn.setAttribute('aria-label', playing ? '일시정지' : '재생');
          setStatus(STATUS[e.data] ?? '');
          if (playing) setError(null);
        },
        onError(e) { setError(e.data); },
      },
    });
  }

  window.onYouTubeIframeAPIReady = () => {
    yt.apiReady = true;
    if (state.quiz) loadIntoPlayer(state.quiz);
  };
  const apiScript = document.createElement('script');
  apiScript.src = 'https://www.youtube.com/iframe_api';
  apiScript.onerror = () => { yt.apiFailed = true; if (state.quiz) setError('api'); };
  document.head.append(apiScript);

  function setStatus(text) { el.status.textContent = text; }
  function setError(code) {
    el.cover.classList.toggle('has-error', code != null);
    el.error.hidden = code == null;
    el.status.hidden = code != null;
    if (code == null) return;
    const q = state.quiz;
    const link = q ? `https://www.youtube.com/watch?v=${encodeURIComponent(q.videoId)}&t=${q.start}s` : '';
    el.error.innerHTML = `<strong>재생할 수 없습니다${typeof code === 'number' ? ` (오류 ${code})` : ''}</strong>
      ${esc(ERRORS[code] ?? '알 수 없는 오류가 발생했습니다.')}
      ${link ? `<br><a href="${link}" target="_blank" rel="noopener">유튜브에서 직접 열기 ↗</a>` : ''}`;
    el.cover.classList.remove('playing');
    el.playBtn.classList.remove('is-playing');
  }

  function canControl() {
    if (yt.ready && state.quiz) return true;
    setStatus(yt.apiFailed ? 'YouTube를 불러오지 못했습니다' : '플레이어 준비 중입니다. 잠시 후 다시 눌러주세요.');
    return false;
  }
  const isPlaying = () => yt.playerState === YT.PlayerState.PLAYING || yt.playerState === YT.PlayerState.BUFFERING;

  function togglePlay() {
    if (!canControl()) return;
    if (isPlaying()) yt.player.pauseVideo();
    else if (yt.playerState === YT.PlayerState.ENDED) restart();
    else yt.player.playVideo();
  }
  function restart() {
    if (!canControl()) return;
    yt.player.seekTo(state.quiz.start, true);
    yt.player.playVideo();
    showTime(state.quiz.start);
  }
  // 정지 = 멈추고 시작 지점으로 되돌림
  function stop() {
    if (!canControl()) return;
    yt.player.cueVideoById({ videoId: state.quiz.videoId, startSeconds: state.quiz.start });
    showTime(state.quiz.start);
  }
  function seekTo(t, { play = false } = {}) {
    if (!canControl()) return;
    const dur = yt.player.getDuration() || Infinity;
    t = Math.min(Math.max(0, t), Math.max(0, dur - 1));
    yt.player.seekTo(t, true);
    if (play) yt.player.playVideo();
    showTime(t);
  }
  function skip(delta) {
    if (!canControl()) return;
    seekTo(yt.player.getCurrentTime() + delta);
  }
  function showTime(t) {
    el.curTime.textContent = fmt(t);
    if (state.seeking) return;
    el.seek.value = Math.floor(t);
    setBar(el.seek, t, Number(el.seek.max));
  }

  // 재생 위치 표시 갱신
  setInterval(() => {
    if (!yt.ready || el.stage.hidden || state.seeking || !state.quiz) return;
    const dur = yt.player.getDuration?.() || 0;
    if (dur) { el.seek.max = Math.floor(dur); el.durTime.textContent = fmt(dur); }
    const cued = yt.playerState === YT.PlayerState.CUED || yt.playerState === -1;
    showTime(cued ? state.quiz.start : yt.player.getCurrentTime?.() || 0);
  }, 250);

  function pauseIfPlaying() {
    if (yt.ready && isPlaying()) yt.player.pauseVideo();
  }

  // ---------- 이벤트 ----------
  el.playBtn.addEventListener('click', togglePlay);
  el.stopBtn.addEventListener('click', stop);
  el.restartBtn.addEventListener('click', restart);
  el.back10Btn.addEventListener('click', () => skip(-10));
  el.fwd10Btn.addEventListener('click', () => skip(10));
  el.revealBtn.addEventListener('click', toggleAnswer);
  el.doneBtn.addEventListener('click', toggleDone);
  el.resetQuizBtn.addEventListener('click', resetQuiz);
  el.videoBtn.addEventListener('click', () => setVideo(!el.screen.classList.contains('show-video')));

  el.seek.addEventListener('input', () => {
    state.seeking = true;
    el.curTime.textContent = fmt(el.seek.value);
    setBar(el.seek, Number(el.seek.value), Number(el.seek.max));
  });
  el.seek.addEventListener('change', () => { state.seeking = false; seekTo(Number(el.seek.value)); el.seek.blur(); });

  el.jumpForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const t = parseTime(el.jumpInput.value);
    el.jumpInput.classList.toggle('invalid', t == null);
    if (t == null) return;
    seekTo(t, { play: true });
    el.jumpInput.value = '';
    el.jumpInput.blur();
  });
  el.jumpInput.addEventListener('input', () => el.jumpInput.classList.remove('invalid'));

  el.volume.value = store.get(KEY.volume, 80);
  setBar(el.volume, Number(el.volume.value), 100);
  el.volume.addEventListener('input', () => {
    const v = Number(el.volume.value);
    setBar(el.volume, v, 100);
    store.set(KEY.volume, v);
    if (yt.ready) { yt.player.setVolume(v); if (v > 0 && yt.player.isMuted()) yt.player.unMute(); }
  });
  el.volume.addEventListener('change', () => el.volume.blur());

  el.resetAllBtn.addEventListener('click', () => {
    if (!confirm('모든 문제의 정답 공개·완료 기록을 지울까요?')) return;
    progress = {};
    store.remove(KEY.progress);
    if (state.quiz) { setAnswerVisible(false); renderQuizState(); }
    else showBoard(state.cat);
  });

  // 마우스로 누른 버튼은 포커스를 풀어 Space 단축키와 겹치지 않게 함
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button, a');
    if (b && e.detail > 0) b.blur();
  });

  // 단축키 (한글 입력 상태에서도 동작하도록 e.code 사용)
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input:not([type="range"]), textarea')) {
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey || el.stage.hidden) return;
    const go = (a) => { if (a.getAttribute('href')) location.hash = a.getAttribute('href'); };
    const actions = {
      Space: togglePlay,
      ArrowLeft: () => skip(-5),
      ArrowRight: () => skip(5),
      KeyR: restart,
      KeyA: toggleAnswer,
      KeyD: toggleDone,
      KeyV: () => state.answerShown && setVideo(!el.screen.classList.contains('show-video')),
      PageUp: () => go(el.prevBtn),
      PageDown: () => go(el.nextBtn),
      Escape: () => { location.hash = state.cat.id; },
    };
    const fn = actions[e.code];
    if (!fn) return;
    e.preventDefault();
    fn();
  });

  // ---------- 시작 ----------
  document.title = DATA.title ?? document.title;
  el.appTitle.textContent = DATA.title ?? '워크샵 퀴즈';
  if (location.protocol === 'file:') el.fileBanner.hidden = false;
  el.eq.innerHTML = Array.from({ length: 56 }, (_, i) => {
    const wave = 0.12 + 0.18 * Math.abs(Math.sin(i * 0.45));
    return `<span style="--h:${wave.toFixed(2)};--d:${(0.4 + Math.random() * 0.6).toFixed(2)}s;--delay:-${Math.random().toFixed(2)}s"></span>`;
  }).join('');
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
